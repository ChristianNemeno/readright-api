# Host-agnostic deployment for the ReadRight API.
#
# Works on any always-on Docker host (Hetzner, Oracle Cloud, a plain VPS, etc.).
# Caddy terminates TLS (auto Let's Encrypt for $API_DOMAIN) and reverse-proxies
# to the API on the private compose network — the API itself is never exposed to
# the internet directly.
#
# Setup on the host:
#   1. cp .env.example .env   &&   fill in API_KEY, SUPABASE_*, API_DOMAIN, ACME_EMAIL
#   2. point $API_DOMAIN's DNS A record at this box
#   3. docker compose pull && docker compose up -d
#
# On a PaaS that already gives you HTTPS (Fly.io / Render / Cloud Run) you don't
# need the caddy service — run the api image directly and enforce upload size via
# MAX_UPLOAD_MB (the app already does).

services:
  api:
    image: ${IMAGE:-ghcr.io/christiannemeno/readright-api:latest}
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"          # private to the compose network only — not published to the host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s  # base.en int8 loads fast; generous margin for a cold/busy box
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # persists issued certs across restarts
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
