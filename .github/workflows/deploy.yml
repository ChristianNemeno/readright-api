name: Deploy

# Host-agnostic deploy: test -> build & push image to GHCR -> ship docker-compose
# to any always-on Docker host over SSH and roll it forward.
#
# Required repo secrets:
#   GHCR_PAT        - PAT with write:packages (build/push) + read:packages (host pull)
#   DEPLOY_HOST     - IP or hostname of the deploy box
#   DEPLOY_SSH_KEY  - private SSH key authorized on the box
#   DEPLOY_USER     - SSH user (optional; defaults to root)
#
# One-time host setup (not done by CI — keeps secrets off GitHub):
#   mkdir -p /opt/readright
#   cp .env.example /opt/readright/.env   # then fill in real API_KEY, SUPABASE_*, API_DOMAIN, ACME_EMAIL, IMAGE
#   point $API_DOMAIN DNS at the box

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # lets you re-run the pipeline on demand from the Actions tab, no commit needed

env:
  IMAGE: ghcr.io/christiannemeno/readright-api
  DEPLOY_DIR: /opt/readright

jobs:
  test:
    name: Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgles2 libegl1

      - name: Install dependencies
        run: pip install -r requirements.txt pyright

      - name: Pyright
        run: pyright app/

      - name: Pytest
        run: pytest
        env:
          API_KEY: test-api-key

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: christiannemeno
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: ${{ env.DEPLOY_DIR }}

      - name: Pull & roll forward
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_PAT,GHCR_USER,DEPLOY_DIR
          script: |
            set -e
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            cd "$DEPLOY_DIR"
            docker compose pull
            docker compose up -d

            echo "Waiting for API health..."
            for i in $(seq 1 18); do
              if docker compose exec -T api curl -sf http://localhost:8000/health; then
                echo "healthy"
                exit 0
              fi
              echo "attempt $i/18 — waiting 10s"
              sleep 10
            done
            echo "API did not become healthy in time" >&2
            docker compose logs --tail=50 api >&2
            exit 1
